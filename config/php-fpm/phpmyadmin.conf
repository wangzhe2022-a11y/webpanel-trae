; ============================================================================
; PHP-FPM pool for built-in phpMyAdmin (panel vhost /phpmyadmin/)
; ----------------------------------------------------------------------------
[phpmyadmin]
user = webpanel
group = webpanel

listen = /run/php-fpm/phpmyadmin.sock
listen.owner = nginx
listen.group = nginx
listen.mode = 0660

pm = ondemand
pm.max_children = 6
pm.process_idle_timeout = 30s
pm.max_requests = 500

php_admin_value[open_basedir] = /www/server/phpmyadmin:/tmp
php_admin_value[upload_tmp_dir] = /tmp
php_admin_value[session.save_path] = /www/server/phpmyadmin/tmp
php_admin_value[error_log] = /www/wwwlogs/phpmyadmin.php-error.log
php_admin_value[memory_limit] = 256M
php_admin_value[upload_max_filesize] = 128M
php_admin_value[post_max_size] = 132M
php_admin_value[max_execution_time] = 300
php_admin_value[max_input_time] = 300
php_admin_value[date.timezone] = Asia/Shanghai
php_admin_value[disable_functions] = passthru,shell_exec,system,proc_open,popen,pcntl_exec,pcntl_fork,pcntl_waitpid,show_source,posix_kill,posix_setuid,posix_setgid,posix_seteuid,posix_setegid
